manifest_version = 2

[package]
name = "clingy"
version = "0.6.3"
kind = "bin"
description = "Deterministic Declarative CLI Engine for Lua"

[interpreter]
name = "lua"
version = "5.4"
abi = "5.4"

[scripts]
test = "lua tests/runner.lua"
test-process-supervision = "python3 tests/process_supervision.py"
test-packaged-completion = "bash tests/packaged-completion.sh"
dev = "lua ./src/main.lua \"$@\""
package = "moon exec ballad -- play partiture.lua"

[[dependencies]]
name = "moonstone/ballad"
constraint = "^0.3.5"
role = "tool"

[[dependencies]]
name = "moonstone/alter"
constraint = "^0.1.1"
role = "runtime"

[[dependencies]]
name = "moonstone/alter-jsonc"
constraint = "^0.1.1"
role = "runtime"

[[dependencies]]
name = "moonstone/valua"
constraint = "^0.2.6"
role = "runtime"

[[dependencies]]
name = "moonstone/luals-composer"
constraint = "^0.1.0"
role = "runtime"
